<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#3a201b"/>
      <stop offset="55%" stop-color="#1a0d0c"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#ff4533" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ff4533" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4533" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tomato" cx="38%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#ff7a63"/>
      <stop offset="42%" stop-color="#f23b32"/>
      <stop offset="82%" stop-color="#cf1c18"/>
      <stop offset="100%" stop-color="#9e0f12"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46d65f"/>
      <stop offset="100%" stop-color="#1c8b3a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa84a"/>
      <stop offset="100%" stop-color="#226b2c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="handsh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a0a0a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="552" r="430" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="838" rx="252" ry="42" fill="#000000" opacity="0.40" filter="url(#softer)"/>

  <!-- leaf crown (behind tomato top) -->
  <g transform="translate(512,300)">
    <g fill="url(#leaf)">
      <g transform="rotate(0)"><path d="M0,0 Q-26,-62 0,-150 Q26,-62 0,0 Z"/></g>
      <g transform="rotate(52)"><path d="M0,0 Q-24,-55 0,-132 Q24,-55 0,0 Z"/></g>
      <g transform="rotate(-52)"><path d="M0,0 Q-24,-55 0,-132 Q24,-55 0,0 Z"/></g>
      <g transform="rotate(104)"><path d="M0,0 Q-22,-46 0,-112 Q22,-46 0,0 Z"/></g>
      <g transform="rotate(-104)"><path d="M0,0 Q-22,-46 0,-112 Q22,-46 0,0 Z"/></g>
    </g>
    <path d="M-13,4 Q-16,-44 0,-78 Q16,-44 13,4 Z" fill="url(#stem)"/>
  </g>

  <!-- tomato body -->
  <ellipse cx="512" cy="552" rx="338" ry="306" fill="url(#tomato)"/>
  <!-- bottom core shading -->
  <ellipse cx="512" cy="640" rx="300" ry="240" fill="#7d0b10" opacity="0.18" filter="url(#soft)"/>
  <!-- glossy highlight -->
  <ellipse cx="402" cy="418" rx="118" ry="74" transform="rotate(-22 402 418)" fill="#ffffff" opacity="0.30" filter="url(#soft)"/>
  <ellipse cx="372" cy="392" rx="44" ry="28" transform="rotate(-22 372 392)" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>

  <!-- clock / timer face -->
  <g stroke="#fbf1df" stroke-linecap="round">
    <!-- minor ticks -->
    <g stroke-width="9" opacity="0.78">
      <line x1="512" y1="352" x2="512" y2="368"/>
      <line x1="612" y1="378.8" x2="603.7" y2="393.1"/>
      <line x1="685.2" y1="452" x2="670.9" y2="460.3"/>
      <line x1="685.2" y1="652" x2="670.9" y2="643.7"/>
      <line x1="612" y1="725.2" x2="603.7" y2="710.9"/>
      <line x1="412" y1="725.2" x2="420.3" y2="710.9"/>
      <line x1="338.8" y1="652" x2="353.1" y2="643.7"/>
      <line x1="338.8" y1="452" x2="353.1" y2="460.3"/>
    </g>
    <!-- quarter ticks (bold) -->
    <g stroke-width="14" opacity="0.95">
      <line x1="512" y1="346" x2="512" y2="372"/>
      <line x1="718" y1="552" x2="692" y2="552"/>
      <line x1="512" y1="758" x2="512" y2="732"/>
      <line x1="306" y1="552" x2="332" y2="552"/>
    </g>
  </g>

  <!-- hands at ~10:10 -->
  <g filter="url(#handsh)" stroke="#fbf1df" stroke-linecap="round" fill="none">
    <line x1="512" y1="552" x2="635" y2="481" stroke-width="20"/>
    <line x1="512" y1="552" x2="421" y2="498" stroke-width="26"/>
  </g>
  <circle cx="512" cy="552" r="20" fill="#fbf1df"/>
  <circle cx="512" cy="552" r="8" fill="#cf1c18"/>
</svg>
