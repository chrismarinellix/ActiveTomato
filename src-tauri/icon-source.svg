<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="55%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#D8281C"/>
    </linearGradient>
  </defs>

  <!-- Deep charcoal background (opaque, full-bleed; iOS rounds corners) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Timer dial: full track ring (the "tomato" body) -->
  <circle cx="512" cy="540" r="300" fill="none" stroke="#2E2E2E" stroke-width="86"/>
  <circle cx="512" cy="540" r="300" fill="none" stroke="#ECE8E0" stroke-width="78" stroke-opacity="0.18"/>

  <!-- Red progress arc, ~72% sweep from 12 o'clock clockwise, rounded caps -->
  <path d="M512 240 A300 300 0 1 1 252 690"
        fill="none" stroke="url(#arc)" stroke-width="78" stroke-linecap="round"/>

  <!-- Minute tick marks around the dial -->
  <g stroke="#ECE8E0" stroke-opacity="0.30" stroke-width="8" stroke-linecap="round">
    <line x1="512" y1="284" x2="512" y2="312"/>
    <line x1="740" y1="540" x2="712" y2="540"/>
    <line x1="512" y1="796" x2="512" y2="768"/>
    <line x1="284" y1="540" x2="312" y2="540"/>
  </g>

  <!-- Centered countdown glyph -->
  <text x="512" y="576" font-family="Menlo, ui-monospace, monospace" font-size="150"
        font-weight="700" fill="#ECE8E0" text-anchor="middle" letter-spacing="-6">25</text>

  <!-- Tomato leaf + stem on top, sells the "pomodoro" read -->
  <g>
    <rect x="498" y="150" width="28" height="74" rx="14" fill="#39B54A"/>
    <g fill="#39B54A">
      <path d="M512 236 L 452 150 L 500 186 Z"/>
      <path d="M512 236 L 572 150 L 524 186 Z"/>
      <path d="M512 236 L 420 214 L 492 200 Z"/>
      <path d="M512 236 L 604 214 L 532 200 Z"/>
    </g>
  </g>
</svg>
