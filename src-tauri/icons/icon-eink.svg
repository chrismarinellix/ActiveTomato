<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- E-ink style tomato timer - cream background, monochrome design -->

  <!-- Cream/paper background circle -->
  <circle cx="256" cy="256" r="240" fill="#f5f5f0"/>

  <!-- Outer border ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1a1a1a" stroke-width="12"/>

  <!-- Tomato body outline -->
  <circle cx="256" cy="280" r="170" fill="none" stroke="#1a1a1a" stroke-width="6"/>

  <!-- Tomato segment lines (subtle) -->
  <g stroke="#1a1a1a" stroke-width="2" opacity="0.4">
    <path d="M256 110 Q256 280 256 450" fill="none"/>
    <path d="M120 200 Q256 280 392 360" fill="none"/>
    <path d="M120 360 Q256 280 392 200" fill="none"/>
  </g>

  <!-- Timer tick marks -->
  <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="256" y1="120" x2="256" y2="145"/>
    <!-- 3 o'clock -->
    <line x1="416" y1="280" x2="391" y2="280"/>
    <!-- 6 o'clock -->
    <line x1="256" y1="440" x2="256" y2="415"/>
    <!-- 9 o'clock -->
    <line x1="96" y1="280" x2="121" y2="280"/>
  </g>

  <!-- Small tick marks -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="340" y1="140" x2="330" y2="155"/>
    <line x1="400" y1="200" x2="385" y2="210"/>
    <line x1="400" y1="360" x2="385" y2="350"/>
    <line x1="340" y1="420" x2="330" y2="405"/>
    <line x1="172" y1="420" x2="182" y2="405"/>
    <line x1="112" y1="360" x2="127" y2="350"/>
    <line x1="112" y1="200" x2="127" y2="210"/>
    <line x1="172" y1="140" x2="182" y2="155"/>
  </g>

  <!-- Stem -->
  <path d="M256 110 Q256 70 240 50 Q230 40 238 55 Q245 70 256 110" fill="#1a1a1a"/>
  <path d="M256 110 Q256 70 272 50 Q282 40 274 55 Q267 70 256 110" fill="#1a1a1a"/>

  <!-- Leaf -->
  <ellipse cx="295" cy="65" rx="40" ry="16" fill="#1a1a1a" transform="rotate(-25 295 65)"/>

  <!-- Center pivot dot -->
  <circle cx="256" cy="280" r="10" fill="#1a1a1a"/>

  <!-- Clock hands (minute hand pointing to tomato shape) -->
  <line x1="256" y1="280" x2="256" y2="160" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="340" y2="320" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
</svg>
