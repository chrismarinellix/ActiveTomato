            osc.stop(audioCtx.currentTime + 0.06);
        };

        const playModeChangeSound = (audioCtx, masterGain) => {
            if (!audioCtx) return;
            const destination = masterGain || audioCtx.destination;
            // Gentle whoosh
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(destination);
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(280, audioCtx.currentTime + 0.15);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        };

        const playToggleSound = (audioCtx, masterGain, on) => {
            if (!audioCtx) return;
            const destination = masterGain || audioCtx.destination;
            // Soft pop
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(destination);
            osc.frequency.value = on ? 280 : 180;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.02);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
        };

        // Tick sound styles
        const tickStyles = {
            soft: (audioCtx, destination) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(destination);
                osc.frequency.value = 200;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.02);
            },
            click: (audioCtx, destination) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(destination);
                osc.frequency.value = 800;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.008);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.008);
            },
            pulse: (audioCtx, destination) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(destination);
                osc.frequency.value = 60;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.03);
            },
            woodblock: (audioCtx, destination) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(destination);
                osc.frequency.value = 1200;
                osc.type = 'triangle';
                gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.012);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.012);
            }
        };

        const playTickSound = (audioCtx, masterGain, style = 'soft') => {
            if (!audioCtx) return;
            const destination = masterGain || audioCtx.destination;
            if (tickStyles[style]) {
                tickStyles[style](audioCtx, destination);
            }
        };

        // Save pomodoro session to Supabase
        async function saveSessionToSupabase(userId, sessionType, durationSeconds, points) {
            if (!supabase || !userId) return;
            try {
                const today = new Date().toISOString().split('T')[0];

                // Save individual session
                await supabase.from('pomodoro_sessions').insert({
                    user_id: userId,
                    session_type: sessionType,
                    duration_seconds: durationSeconds,
                    points_earned: points,
                    date: today
                });

                // Update daily activity
                const { data: existing } = await supabase
                    .from('daily_activity')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('date', today)
                    .single();

                if (existing) {
                    await supabase.from('daily_activity')
                        .update({
                            pomodoros_completed: existing.pomodoros_completed + 1,
                            total_focus_minutes: existing.total_focus_minutes + Math.floor(durationSeconds / 60),
                            points_earned: existing.points_earned + points
                        })
                        .eq('user_id', userId)
                        .eq('date', today);
                } else {
                    await supabase.from('daily_activity').insert({
                        user_id: userId,
                        date: today,
                        pomodoros_completed: 1,
                        total_focus_minutes: Math.floor(durationSeconds / 60),
                        points_earned: points
                    });
                }

                // Update profile points
                await supabase.from('profiles')
                    .update({ total_points: supabase.rpc ? undefined : points })
                    .eq('id', userId);

                // Try RPC if available
                await supabase.rpc('add_user_points', { p_user_id: userId, p_points: points }).catch(() => {});

                console.log('Session saved to Supabase');
            } catch (err) {
                console.error('Error saving to Supabase:', err);
            }
        }

        // Load user data from Supabase
        async function loadUserDataFromSupabase(userId) {
            if (!supabase || !userId) return null;
            try {
                // Load profile
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('total_points')
                    .eq('id', userId)
                    .single();

                // Load daily activity for the year
                const yearAgo = new Date();
                yearAgo.setFullYear(yearAgo.getFullYear() - 1);
                const { data: activity } = await supabase
                    .from('daily_activity')
                    .select('date, pomodoros_completed')
                    .eq('user_id', userId)
                    .gte('date', yearAgo.toISOString().split('T')[0]);

                // Convert to activityData format
                const activityMap = {};
                if (activity) {
                    activity.forEach(row => {
                        activityMap[row.date] = row.pomodoros_completed;
                    });
                }

                // Get today's count
                const today = new Date().toISOString().split('T')[0];
                const todayCount = activityMap[today] || 0;

                return {
                    totalPoints: profile?.total_points || 0,
                    activityData: activityMap,
                    todayCount: todayCount
                };
            } catch (err) {
                console.error('Error loading from Supabase:', err);
                return null;
            }
        }

        // Save timer state to Supabase for cross-device sync
        async function saveTimerState(userId, state) {
            if (!supabase || !userId) return;
            try {
                const { error } = await supabase.from('timer_state').upsert({
                    user_id: userId,
                    is_running: state.isRunning,
                    mode: state.mode,
                    time_left: state.timeLeft,
                    started_at: state.isRunning ? new Date().toISOString() : null,
                    series_target: state.seriesTarget,
                    series_progress: state.seriesProgress,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });
                if (error) {
                    console.error('Error saving timer state:', error);
                } else {
                    console.log('Timer state saved:', state.isRunning ? 'running' : 'paused', state.timeLeft + 's');
                }
            } catch (err) {
                console.error('Error saving timer state:', err);
            }
        }

        // Load timer state from Supabase
        async function loadTimerState(userId) {
            if (!supabase || !userId) return null;
            try {
                const { data, error } = await supabase
                    .from('timer_state')
                    .select('*')
                    .eq('user_id', userId)
                    .single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Error loading timer state:', error);
                    return null;
                }

                if (data) {
                    // Calculate current time_left if timer was running
                    let timeLeft = data.time_left;
                    if (data.is_running && data.started_at) {
                        const elapsed = Math.floor((Date.now() - new Date(data.started_at).getTime()) / 1000);
                        timeLeft = Math.max(0, data.time_left - elapsed);
                    }
                    return {
                        isRunning: data.is_running && timeLeft > 0,
                        mode: data.mode,
                        timeLeft: timeLeft,
                        seriesTarget: data.series_target,
                        seriesProgress: data.series_progress
                    };
                }
                return null;
            } catch (err) {
                console.error('Error loading timer state:', err);
                return null;
            }
        }

        function ActiveTomato({ user, onLogout }) {
            const [mode, setMode] = useState('work');
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isRunning, setIsRunning] = useState(false);
            const [sessionsCompleted, setSessionsCompleted] = useState(0);
            const [seriesTarget, setSeriesTarget] = useState(1);
            const [seriesProgress, setSeriesProgress] = useState(0);
            const [seriesPhase, setSeriesPhase] = useState('work'); // 'work' or 'break'
            const [dataLoaded, setDataLoaded] = useState(false);

            const [totalPoints, setTotalPoints] = useState(() => {
                const saved = localStorage.getItem('activeTomatoPoints');
                return saved ? parseInt(saved) : 0;
            });
            const [todayPomodoros, setTodayPomodoros] = useState(() => {
                const saved = localStorage.getItem('activeTomatoToday');
                const data = saved ? JSON.parse(saved) : { date: new Date().toDateString(), count: 0 };
                return data.date !== new Date().toDateString() ? { date: new Date().toDateString(), count: 0 } : data;
            });
            const [activityData, setActivityData] = useState(() => {
                const saved = localStorage.getItem('activeTomatoActivity');
                return saved ? JSON.parse(saved) : {};
            });
            const [todayLog, setTodayLog] = useState(() => {
                const saved = localStorage.getItem('activeTomatoLog');
                const data = saved ? JSON.parse(saved) : { date: new Date().toDateString(), entries: [] };
                return data.date !== new Date().toDateString() ? { date: new Date().toDateString(), entries: [] } : data;
            });

            // Load data from Supabase on mount and subscribe to realtime
            useEffect(() => {
                // If no supabase, mark as error
                if (!supabase) {
                    setSyncStatus('error');
                }

                if (user?.id && !dataLoaded) {
                    // Load activity data
                    loadUserDataFromSupabase(user.id).then(data => {
                        if (data) {
                            setTotalPoints(data.totalPoints);
                            setActivityData(data.activityData);
                            setTodayPomodoros(prev => ({ ...prev, count: data.todayCount }));
                            localStorage.setItem('activeTomatoPoints', data.totalPoints);
                            localStorage.setItem('activeTomatoActivity', JSON.stringify(data.activityData));
                        }
                    });

                    // Load timer state
                    loadTimerState(user.id).then(state => {
                        if (state) {
                            syncingFromRemoteRef.current = true;
                            setMode(state.mode);
                            setTimeLeft(state.timeLeft);
                            setIsRunning(state.isRunning);
                            setSeriesTarget(state.seriesTarget);
                            setSeriesProgress(state.seriesProgress);
                            setTimeout(() => { syncingFromRemoteRef.current = false; }, 100);
                        }
                        setDataLoaded(true);
                    });

                    // Subscribe to realtime timer updates (exact wall-display pattern)
                    if (supabase) {
                        const channel = supabase
                            .channel('timer-changes')
                            .on(
                                'postgres_changes',
                                { event: '*', schema: 'public', table: 'timer_state' },
                                async () => {
                                    // Refetch timer state when any change happens
                                    console.log('Realtime: timer_state changed, refetching...');
                                    const state = await loadTimerState(user.id);
                                    if (state) {
                                        syncingFromRemoteRef.current = true;
                                        setMode(state.mode);
                                        setTimeLeft(state.timeLeft);
                                        setIsRunning(state.isRunning);
                                        setSeriesTarget(state.seriesTarget);
                                        setSeriesProgress(state.seriesProgress);
                                        console.log('Timer synced from remote:', state.isRunning ? 'running' : 'paused');
                                        setTimeout(() => { syncingFromRemoteRef.current = false; }, 100);
                                    }
                                }
                            )
                            .subscribe();

                        realtimeChannelRef.current = channel;
                        setSyncStatus('connected');
                    }
                }

                return () => {
                    if (realtimeChannelRef.current) {
                        supabase?.removeChannel(realtimeChannelRef.current);
                    }
                };
            }, [user, dataLoaded]);

            // Load saved preferences from localStorage
            const loadPreferences = () => {
                try {
                    const saved = localStorage.getItem('activetomato-preferences');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            };
            const savedPrefs = loadPreferences();

            // Sound toggles (load from saved preferences)
            const [soundEnabled, setSoundEnabled] = useState(savedPrefs.soundEnabled ?? true);
            const [intervalSoundEnabled, setIntervalSoundEnabled] = useState(savedPrefs.intervalSoundEnabled ?? true);
            const [beepInterval, setBeepInterval] = useState(savedPrefs.beepInterval ?? 5); // 1 or 5 minutes
            const [tickSoundEnabled, setTickSoundEnabled] = useState(savedPrefs.tickSoundEnabled ?? false);
            const [tickStyle, setTickStyle] = useState(savedPrefs.tickStyle ?? 'soft');
            const [voiceCuesEnabled, setVoiceCuesEnabled] = useState(savedPrefs.voiceCuesEnabled ?? true);

            // Reminder & Auto-start (load from saved preferences)
            const [reminderEnabled, setReminderEnabled] = useState(savedPrefs.reminderEnabled ?? false);
            const [reminderInterval, setReminderInterval] = useState(savedPrefs.reminderInterval ?? 30);
            const [autoStartEnabled, setAutoStartEnabled] = useState(savedPrefs.autoStartEnabled ?? false);
            const [autoSeriesEnabled, setAutoSeriesEnabled] = useState(savedPrefs.autoSeriesEnabled ?? false);

            const [notification, setNotification] = useState(null);
            const [hoveredDay, setHoveredDay] = useState(null);
            const [syncStatus, setSyncStatus] = useState('connecting'); // 'connecting', 'connected', 'error'

            const audioCtxRef = useRef(null);
            const lastIntervalRef = useRef(0);
            const reminderTimerRef = useRef(null);
            const realtimeChannelRef = useRef(null);
            const syncingFromRemoteRef = useRef(false);
            const prevIsRunningRef = useRef(false);

            // WebGL refs
            const orbCanvasRef = useRef(null);
            const orbRef = useRef(null);
            const masterGainRef = useRef(null);
            const completingRef = useRef(false); // Guard against double completion
            const [systemVolume, setSystemVolume] = useState(savedPrefs.systemVolume ?? 0.5);

            const durations = { work: 25 * 60, shortBreak: 5 * 60, longBreak: 15 * 60 };
            const modeLabels = { work: 'Focus', shortBreak: 'Short Break', longBreak: 'Long Break' };

            const initAudio = () => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = createAudioContext();
                }
                // Mobile browsers suspend AudioContext - must resume on user gesture
                if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }

                // Initialize master gain node for system volume control
                if (!masterGainRef.current && audioCtxRef.current) {
                    masterGainRef.current = audioCtxRef.current.createGain();
                    masterGainRef.current.connect(audioCtxRef.current.destination);
                    masterGainRef.current.gain.value = systemVolume;
                }
            };

            // Save preferences to localStorage whenever they change
            useEffect(() => {
                const prefs = {
                    soundEnabled,
                    intervalSoundEnabled,
                    beepInterval,
                    tickSoundEnabled,
                    tickStyle,
                    voiceCuesEnabled,
                    reminderEnabled,
                    reminderInterval,
                    autoStartEnabled,
                    autoSeriesEnabled,
                    systemVolume
                };
                localStorage.setItem('activetomato-preferences', JSON.stringify(prefs));
            }, [soundEnabled, intervalSoundEnabled, beepInterval, tickSoundEnabled, tickStyle, voiceCuesEnabled,
                reminderEnabled, reminderInterval, autoStartEnabled, autoSeriesEnabled, systemVolume]);

            // Initialize WebGL background and orb
            useEffect(() => {
                // Initialize background particles (async for WebGPU check)
                const initBg = async () => {
                    if (!webglBg) {
                        webglBg = await initWebGLBackground();
                    }
                };
                initBg();

                // Initialize timer orb
                if (orbCanvasRef.current && !orbRef.current) {
                    orbRef.current = createTimerOrb(orbCanvasRef.current);
                }

                return () => {
                    if (orbRef.current) {
                        orbRef.current.destroy();
                        orbRef.current = null;
                    }
                };
            }, []);

            // Update orb state based on timer
            useEffect(() => {
                if (orbRef.current) {
                    orbRef.current.setRunning(isRunning);
                    orbRef.current.setProgress((durations[mode] - timeLeft) / durations[mode]);
                }
                if (webglBg) {
                    webglBg.setTimerState(isRunning, (durations[mode] - timeLeft) / durations[mode]);
                }
            }, [isRunning, timeLeft, mode]);

            // Handle tab visibility changes (prevents issues during long sessions)
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        // Tab is hidden - WebGL may be throttled
                        console.log('Tab hidden, WebGL may pause');
                    } else {
                        // Tab is visible again - ensure WebGL is running
                        console.log('Tab visible, resuming WebGL');
                        if (orbRef.current) {
                            // Refresh orb state
                            orbRef.current.setRunning(isRunning);
                            orbRef.current.setProgress((durations[mode] - timeLeft) / durations[mode]);
                        }
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [isRunning, mode, timeLeft]);

            // Handle system volume changes
            const handleSystemVolumeChange = (vol) => {
                setSystemVolume(vol);
                if (masterGainRef.current) {
                    masterGainRef.current.gain.linearRampToValueAtTime(vol, audioCtxRef.current.currentTime + 0.1);
                }
            };

            // Tauri widget mode toggle
            const toggleWidgetMode = async () => {
                if (window.__TAURI__) {
                    try {
                        await window.__TAURI__.core.invoke('toggle_widget_mode');
                    } catch (e) {
                        console.log('Widget mode toggle failed:', e);
                    }
                }
            };

            const getLevel = () => {
                if (totalPoints < 100) return { level: 1, title: 'Seedling' };
                if (totalPoints < 300) return { level: 2, title: 'Sprout' };
                if (totalPoints < 600) return { level: 3, title: 'Sapling' };
                if (totalPoints < 1000) return { level: 4, title: 'Tree' };
                if (totalPoints < 2000) return { level: 5, title: 'Grove' };
                return { level: 6, title: 'Forest' };
            };

            const showNotification = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3000);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const addLogEntry = (message) => {
                const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                setTodayLog(prev => {
                    const newLog = { ...prev, entries: [...prev.entries, { time, message }].slice(-10) };
                    localStorage.setItem('activeTomatoLog', JSON.stringify(newLog));
                    return newLog;
                });
            };

            const handleModeChange = (newMode) => {
                initAudio();
                if (soundEnabled && audioCtxRef.current) {
                    playModeChangeSound(audioCtxRef.current, masterGainRef.current);
                }
                setMode(newMode);
                setTimeLeft(durations[newMode]);
                setIsRunning(false);
                lastIntervalRef.current = 0;
            };

            const handleSeriesSelect = (target) => {
                initAudio();
                if (soundEnabled && audioCtxRef.current) {
                    playClickSound(audioCtxRef.current, masterGainRef.current);
                }
                setSeriesTarget(target);
                setSeriesProgress(0);
                setSeriesPhase('work');
                handleModeChange('work');
            };

            const startTimer = () => {
                initAudio();
                if (!isRunning) {
                    addLogEntry(`Started ${modeLabels[mode]}`);
                    if (soundEnabled && audioCtxRef.current) {
                        playStartSound(audioCtxRef.current, masterGainRef.current);
                    }
                }
                setIsRunning(true);
            };

            const toggleTimer = () => {
                initAudio();
                if (!isRunning) {
                    addLogEntry(`Started ${modeLabels[mode]}`);
                    if (soundEnabled && audioCtxRef.current) {
                        playStartSound(audioCtxRef.current, masterGainRef.current);
                    }
                    if (voiceCuesEnabled) {
                        voiceCueSystem.announceStart(mode);
                    }
                } else {
                    if (soundEnabled && audioCtxRef.current) {
                        playPauseSound(audioCtxRef.current, masterGainRef.current);
                    }
                    if (voiceCuesEnabled) {
                        voiceCueSystem.announcePause();
                    }
                }
                setIsRunning(!isRunning);
            };

            const resetTimer = () => {
                initAudio();
                if (soundEnabled && audioCtxRef.current) {
                    playClickSound(audioCtxRef.current, masterGainRef.current);
                }
                const newTimeLeft = durations[mode];
                setTimeLeft(newTimeLeft);
                setIsRunning(false);
                lastIntervalRef.current = 0;

                // Force sync reset to other devices
                if (user?.id) {
                    saveTimerState(user.id, {
                        isRunning: false,
                        mode,
                        timeLeft: newTimeLeft,
                        seriesTarget,
                        seriesProgress
                    });
                }
            };

            // Sync timer state to Supabase when key values change
            useEffect(() => {
                if (!user?.id || !dataLoaded || syncingFromRemoteRef.current) return;

                // Debounce to avoid too many saves during countdown
                const timeoutId = setTimeout(() => {
                    saveTimerState(user.id, {
                        isRunning,
                        mode,
                        timeLeft,
                        seriesTarget,
                        seriesProgress
                    });
                }, isRunning ? 5000 : 300); // Save every 5s when running, 300ms when paused

                return () => clearTimeout(timeoutId);
            }, [user?.id, dataLoaded, isRunning, mode, seriesTarget, seriesProgress]);

            // Save immediately on start/stop (only trigger on isRunning change)
            useEffect(() => {
                if (!user?.id || !dataLoaded) return;
                // Only save when isRunning actually changes
                if (prevIsRunningRef.current === isRunning) return;
                prevIsRunningRef.current = isRunning;

                if (syncingFromRemoteRef.current) {
                    console.log('Skipping save - syncing from remote');
                    return;
                }
                console.log('Saving timer state on start/stop:', isRunning ? 'STARTED' : 'STOPPED', 'timeLeft:', timeLeft);
                saveTimerState(user.id, {
                    isRunning,
                    mode,
                    timeLeft,
                    seriesTarget,
                    seriesProgress
                });
            });

            // Reminder effect
            useEffect(() => {
                if (reminderTimerRef.current) {
                    clearInterval(reminderTimerRef.current);
                }

                if (reminderEnabled && !isRunning) {
                    reminderTimerRef.current = setInterval(() => {
                        initAudio();
                        if (audioCtxRef.current) {
                            playReminderSound(audioCtxRef.current, masterGainRef.current);
                        }
                        showNotification('Time to focus! Start your pomodoro.');

                        if (autoStartEnabled) {
                            setTimeout(() => {
                                startTimer();
                            }, 1500);
                        }
                    }, reminderInterval * 60 * 1000);
                }

                return () => {
                    if (reminderTimerRef.current) {
                        clearInterval(reminderTimerRef.current);
                    }
                };
            }, [reminderEnabled, reminderInterval, isRunning, autoStartEnabled]);

            const completeSession = useCallback(() => {
                // Guard against double completion from useEffect re-runs
                if (completingRef.current) {
                    console.log('completeSession blocked: already completing');
                    return;
                }
                completingRef.current = true;

                // Reset guard after state updates settle
                setTimeout(() => { completingRef.current = false; }, 100);

                if (mode === 'work') {
                    const points = 25;
                    setTotalPoints(prev => {
                        const newTotal = prev + points;
                        localStorage.setItem('activeTomatoPoints', newTotal);
                        return newTotal;
                    });

                    setTodayPomodoros(prev => {
                        const newData = { ...prev, count: prev.count + 1 };
                        localStorage.setItem('activeTomatoToday', JSON.stringify(newData));
                        return newData;
                    });

                    const today = new Date().toISOString().split('T')[0];
                    setActivityData(prev => {
                        const newData = { ...prev, [today]: (prev[today] || 0) + 1 };
                        localStorage.setItem('activeTomatoActivity', JSON.stringify(newData));
                        return newData;
                    });

                    const newSessions = sessionsCompleted + 1;
                    setSessionsCompleted(newSessions);

                    addLogEntry(`Completed pomodoro! +${points} pts`);

                    // Save to Supabase
                    if (user?.id) {
                        saveSessionToSupabase(user.id, 'work', durations.work, points);
                    }

                    if (soundEnabled && audioCtxRef.current) {
                        playCompletionSound(audioCtxRef.current, masterGainRef.current);
                    }
                    if (voiceCuesEnabled) {
                        setTimeout(() => voiceCueSystem.announceCompletion('work', points), 2500);
                    }

                    // Series mode logic
                    if (seriesTarget > 1) {
                        const newProgress = seriesProgress + 1;
                        setSeriesProgress(newProgress);

                        if (newProgress >= seriesTarget) {
                            showNotification(`Series complete! ${seriesTarget} pomodoros done!`);
                            setSeriesProgress(0);
                            setSeriesPhase('work');
                            handleModeChange('longBreak');
                        } else {
                            setSeriesPhase('break');
                            const breakType = newProgress % 4 === 0 ? 'longBreak' : 'shortBreak';
                            setMode(breakType);
                            setTimeLeft(durations[breakType]);
                            lastIntervalRef.current = 0;
                            showNotification(`${newProgress}/${seriesTarget} done. Break time!`);

                            if (autoSeriesEnabled) {
                                setTimeout(() => setIsRunning(true), 2000);
                            } else {
                                setIsRunning(false);
                            }
                        }
                    } else {
                        showNotification(`+${points} points! Great focus session!`);
                        if (newSessions % 4 === 0) {
                            handleModeChange('longBreak');
                        } else {
                            handleModeChange('shortBreak');
                        }
                    }
                } else {
                    addLogEntry(`${modeLabels[mode]} completed`);
                    if (soundEnabled && audioCtxRef.current) {
                        playBeep(audioCtxRef.current, 700, 0.15, 2);
                    }

                    if (seriesTarget > 1 && seriesProgress < seriesTarget) {
                        setSeriesPhase('work');
                        setMode('work');
                        setTimeLeft(durations.work);
                        lastIntervalRef.current = 0;
                        showNotification('Break over! Next pomodoro starting...');

                        if (autoSeriesEnabled) {
                            setTimeout(() => setIsRunning(true), 2000);
                        } else {
                            setIsRunning(false);
                        }
                    } else {
                        handleModeChange('work');
                        showNotification('Break over! Ready to focus?');
                    }
                }
            }, [mode, sessionsCompleted, soundEnabled, seriesTarget, seriesProgress, autoSeriesEnabled]);

            // Timer effect
            useEffect(() => {
                let interval = null;

                if (isRunning && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            const newTime = prev - 1;

                            if (tickSoundEnabled && audioCtxRef.current) {
                                playTickSound(audioCtxRef.current, masterGainRef.current, tickStyle);
                            }

                            if (intervalSoundEnabled && audioCtxRef.current && mode === 'work') {
                                const elapsed = durations[mode] - newTime;
                                const intervalSeconds = beepInterval * 60;
                                const intervals = Math.floor(elapsed / intervalSeconds);
                                if (intervals > lastIntervalRef.current && intervals > 0) {
                                    lastIntervalRef.current = intervals;
                                    playProgressBeep(audioCtxRef.current, masterGainRef.current, intervals);
                                }
                            }

                            if (soundEnabled && audioCtxRef.current && newTime <= 30 && newTime > 0 && newTime % 10 === 0) {
                                playWarningBeep(audioCtxRef.current, masterGainRef.current);
                            }

                            // Voice cues for time remaining
                            if (voiceCuesEnabled) {
                                voiceCueSystem.announceTimeRemaining(newTime, mode);

                                // Elapsed time announcements
                                const elapsedMins = Math.floor((durations[mode] - newTime) / 60);
                                if ((durations[mode] - newTime) % 60 === 0 && elapsedMins > 0) {
                                    voiceCueSystem.announceElapsed(elapsedMins, mode);
                                }
                            }

                            return newTime;
                        });
                    }, 1000);
                } else if (timeLeft === 0 && !completingRef.current) {
                    completeSession();
                }

                return () => clearInterval(interval);
            }, [isRunning, timeLeft, mode, intervalSoundEnabled, beepInterval, soundEnabled, tickSoundEnabled, tickStyle, completeSession]);

            const progress = ((durations[mode] - timeLeft) / durations[mode]) * 100;
            const isWarning = timeLeft <= 60 && isRunning;

            const generateActivityGrid = () => {
                const weeks = [];
                const today = new Date();

                        date.setDate(date.getDate() - (w * 7 + (6 - d)));
                        const dateStr = date.toISOString().split('T')[0];
                        const count = activityData[dateStr] || 0;

                        if (count >= 3) level = 2;
                        if (count >= 5) level = 3;
                        if (count >= 8) level = 4;
                        week.push({ date: dateStr, count, level });
                    }
                    weeks.push(week);
                }
                return weeks;
            };

            const activityGrid = generateActivityGrid();
            const totalPomodoros = Object.values(activityData).reduce((a, b) => a + b, 0);
            const levelInfo = getLevel();
            const elapsedMinutes = Math.floor((durations[mode] - timeLeft) / 60);

            // Generate series dots

                                        <span className={`sync-indicator ${syncStatus}`}>

                                        {[1, 2, 3, 4, 5, 6].map(n => (

        // WebAuthn/Passkey helpers
        const isPasskeySupported = () => {
            return window.PublicKeyCredential !== undefined &&
                   typeof window.PublicKeyCredential === 'function';
        };

        const generateChallenge = () => {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return array;
        };

        const bufferToBase64 = (buffer) => {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)));
        };

        const base64ToBuffer = (base64) => {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        };

        // Auth Component - Simplified single flow
        function AuthScreen({ onAuth }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [passkeySupported, setPasskeySupported] = useState(false);

            useEffect(() => {
                setPasskeySupported(isPasskeySupported());
            }, []);

            // Smart auth - tries sign in first, then sign up if user doesn't exist
            const handleContinue = async (e) => {
                e.preventDefault();
                if (!supabase) {
                    onAuth({ email, id: 'demo' });
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    // Try sign in first
                    const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });

                    if (!signInError) {
                        onAuth(signInData.user);
                        return;
                    }

                    // If invalid credentials, try sign up (new user)
                    if (signInError.message.includes('Invalid login credentials')) {
                        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
                        if (signUpError) throw signUpError;
                        if (signUpData.user) {
                            onAuth(signUpData.user);
                            return;
                        }
                    }

                    throw signInError;
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handlePasskeyAuth = async () => {
                setLoading(true);
                setError('');

                try {
                    const existingPasskeys = JSON.parse(localStorage.getItem('activeTomatoPasskeys') || '[]');

                    if (existingPasskeys.length === 0) {
                        // No passkeys - need to create one
                        // First, sign in with Supabase to get the real user ID
                        const userEmail = prompt('Enter your email to create a passkey:');
                        if (!userEmail) {
                            setLoading(false);
                            return;
                        }
                        const userPassword = prompt('Enter your password (to link passkey to your account):');
                        if (!userPassword) {
                            setLoading(false);
                            return;
                        }

                        // Sign in to Supabase to get the real user ID
                        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
                            email: userEmail,
                            password: userPassword
                        });

                        if (signInError) {
                            setError('Sign in failed: ' + signInError.message);
                            setLoading(false);
                            return;
                        }

                        const supabaseUserId = signInData.user.id;

                        const challenge = generateChallenge();
                        const passkeyUserId = new TextEncoder().encode(userEmail);

                        const credential = await navigator.credentials.create({
                            publicKey: {
                                challenge,
                                rp: { name: 'ActiveTomato', id: window.location.hostname },
                                user: { id: passkeyUserId, name: userEmail, displayName: userEmail.split('@')[0] },
                                pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
                                authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'preferred', residentKey: 'preferred' },
                                timeout: 60000
                            }
                        });

                        // Store passkey with Supabase user ID
                        const passkeyData = {
                            credentialId: bufferToBase64(credential.rawId),
                            email: userEmail,
                            supabaseUserId: supabaseUserId,
                            createdAt: new Date().toISOString()
                        };
                        localStorage.setItem('activeTomatoPasskeys', JSON.stringify([passkeyData]));
                        onAuth({ email: userEmail, id: supabaseUserId, passkey: true });
                        return;
                    }

                    // Has passkeys - authenticate
                    const allowCredentials = existingPasskeys.map(pk => ({
                        type: 'public-key',
                        id: base64ToBuffer(pk.credentialId),
                        transports: ['internal', 'hybrid']
                    }));

                    const assertion = await navigator.credentials.get({
                        publicKey: {
                            challenge: generateChallenge(),
                            rpId: window.location.hostname,
                            allowCredentials,
                            userVerification: 'preferred',
                            timeout: 60000
                        }
                    });

                    const usedCredentialId = bufferToBase64(assertion.rawId);
                    const matchedPasskey = existingPasskeys.find(pk => pk.credentialId === usedCredentialId);

                    if (matchedPasskey) {
                        // Use the stored Supabase user ID, not the WebAuthn assertion ID
                        const userId = matchedPasskey.supabaseUserId || matchedPasskey.email;
                        onAuth({ email: matchedPasskey.email, id: userId, passkey: true });
                    } else {
                        setError('Passkey not recognized');
                    }
                } catch (err) {
                    if (err.name !== 'NotAllowedError') {
                        setError(err.message || 'Passkey failed');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-container">
                    <h1 className="auth-title">ACTIVETOMATO</h1>
                    <p className="auth-subtitle">High-Definition Pomodoro Timer</p>

                    {isSupabaseConfigured && (
                        <form className="auth-form" onSubmit={handleContinue}>
                            <input
                                type="email"
                                className="auth-input"
                                placeholder="Email"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                required
                            />
                            <input
                                type="password"
                                className="auth-input"
                                placeholder="Password (min 6 characters)"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                minLength={6}
                                required
                            />
                            {error && <div className="auth-error">{error}</div>}
                            <button type="submit" className="auth-btn" disabled={loading}>
                                {loading ? 'Please wait...' : 'Continue'}
                            </button>
                        </form>
                    )}

                    {passkeySupported && (
                        <p style={{fontSize: '0.7rem', color: '#888', textAlign: 'center', marginTop: '15px'}}>
                            or <a
                                onClick={handlePasskeyAuth}
                                style={{color: '#555', cursor: 'pointer', textDecoration: 'underline'}}
                            >
                                use passkey
                            </a>
                        </p>
                    )}

                    {!isSupabaseConfigured && (
                        <div className="auth-form" style={{textAlign: 'center'}}>
                            <p style={{fontSize: '0.8rem', color: '#666'}}>Please configure Supabase to continue</p>
                            {error && <div className="auth-error">{error}</div>}
                        </div>
                    )}
                </div>
            );
        }

        // Main App with Auth wrapper
        function App() {
            const [user, setUser] = useState(undefined); // undefined = loading, null = guest, object = logged in
            const [authChecked, setAuthChecked] = useState(false);

            useEffect(() => {
                if (!supabase) {
                    // No Supabase configured - show auth screen
                    setAuthChecked(true);
                    return;
                }

                // Check for existing session
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? undefined);
                    setAuthChecked(true);
                });

                // Listen for auth changes
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? undefined);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                setUser(undefined);
            };

            // Still checking auth
            if (!authChecked) {
                return (
                    <div className="container">
                        <div className="eink-screen">
                            <div className="auth-container">
                                <h1 className="auth-title">ACTIVETOMATO</h1>
                                <p className="auth-subtitle">Loading...</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // Not logged in - show auth screen
            if (user === undefined) {
                return (
                    <div className="container">
                        <div className="eink-screen">
                            <AuthScreen onAuth={setUser} />
                        </div>
                    </div>
                );
            }

            // Logged in or guest mode - show main app
            return <ActiveTomato user={user} onLogout={handleLogout} />;
        }

        // Detect Tauri and add class for frameless window styling
        if (window.__TAURI__) {
            document.body.classList.add('tauri-app');
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
