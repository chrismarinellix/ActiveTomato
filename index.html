<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveTomato - E-Ink Pomodoro Timer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        @media (max-width: 600px) {
            html, body {
                overflow: auto;
                height: auto;
            }
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #151515 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tauri frameless window styling */
        body.tauri-app {
            background: #f5f5f0 !important;
        }
        body.tauri-app .container {
            padding: 0 !important;
        }
        body.tauri-app .eink-screen {
            max-width: 100% !important;
            height: 100vh !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }
        /* Header is the drag region for moving the window */
        body.tauri-app .header {
            -webkit-app-region: drag;
            cursor: grab;
        }
        body.tauri-app .header:active {
            cursor: grabbing;
        }
        /* Exclude interactive elements in header from drag */
        body.tauri-app .header button,
        body.tauri-app .header a,
        body.tauri-app .header .logout-btn {
            -webkit-app-region: no-drag;
            cursor: pointer;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Modern E-Ink Display - Kindle Paperwhite / Boox style */
        .eink-screen {
            background: #f5f5f0;
            border-radius: 3px;
            padding: 35px 50px;
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.08),
                0 25px 80px rgba(0,0,0,0.5),
                0 0 0 8px #1a1a1a,
                0 0 0 10px #0a0a0a;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Subtle paper texture */
        .eink-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.3) 0%, transparent 60%);
            pointer-events: none;
        }

        .screen-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .screen-content::-webkit-scrollbar {
            display: none;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header-left h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 4px;
        }

        .header-left .subtitle {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            gap: 25px;
        }

        .stat-box {
            text-align: right;
        }

        .stat-label {
            font-size: 0.6rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .level-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #1a1a1a;
            color: #f5f5f0;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 1px;
            border-radius: 2px;
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* Series selector */
        .series-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.03);
            border-radius: 3px;
        }

        .series-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .series-buttons {
            display: flex;
            gap: 8px;
        }

        .series-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid rgba(0,0,0,0.15);
            background: transparent;
            color: #555;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.15s ease;
        }

        .series-btn.active {
            background: #1a1a1a;
            color: #f5f5f0;
            border-color: #1a1a1a;
        }

        .series-btn:hover:not(.active) {
            background: rgba(0,0,0,0.05);
        }

        .series-progress {
            display: flex;
            gap: 6px;
            margin-left: 15px;
            padding-left: 15px;
            border-left: 1px solid rgba(0,0,0,0.1);
        }

        .series-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .series-dot.completed {
            background: #1a1a1a;
        }

        .series-dot.current {
            background: transparent;
            border: 2px solid #1a1a1a;
            animation: pulse 1.5s infinite;
        }

        .series-dot.break {
            width: 6px;
            height: 6px;
            margin: 2px 0;
            background: rgba(0,0,0,0.2);
        }

        .series-dot.break.completed {
            background: #666;
        }

        /* Mode tabs */
        .mode-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .mode-tab {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.15s ease;
            border-right: 1px solid rgba(0,0,0,0.1);
        }

        .mode-tab:last-child {
            border-right: none;
        }

        .mode-tab.active {
            background: #1a1a1a;
            color: #f5f5f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .mode-tab:hover:not(.active) {
            background: rgba(0,0,0,0.04);
        }

        /* Timer Display - High Definition */
        .timer-display {
            text-align: center;
            margin: 20px 0;
        }

        .timer-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .timer-digits {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16rem;
            font-weight: 700;
            color: #0a0a0a;
            letter-spacing: -5px;
            line-height: 0.85;
            text-rendering: geometricPrecision;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .timer-digits.warning {
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.4; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(100, 100, 100, 0.1); }
            50% { box-shadow: 0 0 40px rgba(100, 100, 100, 0.2); }
        }

        .timer-progress {
            width: 100%;
            max-width: 600px;
            height: 4px;
            background: rgba(0,0,0,0.08);
            border-radius: 2px;
            margin: 30px auto 0;
            overflow: hidden;
        }

        .timer-progress-bar {
            height: 100%;
            background: #1a1a1a;
            transition: width 1s linear;
        }

        .interval-indicator {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #999;
            letter-spacing: 1px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 14px 45px;
            border: 1px solid #1a1a1a;
            background: transparent;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .btn.primary {
            background: #1a1a1a;
            color: #f5f5f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn.primary:hover {
            background: #2a2a2a;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .btn.primary:active {
            transform: translateY(0);
        }

        /* Toggle panels */
        .toggle-panels {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            padding: 20px 30px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-group-label {
            font-size: 0.6rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .toggle-item label {
            font-size: 0.7rem;
            color: #555;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .toggle-switch {
            width: 38px;
            height: 20px;
            background: rgba(0,0,0,0.12);
            border-radius: 10px;
            position: relative;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .toggle-switch.on {
            background: #1a1a1a;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #f5f5f0;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .toggle-switch.on::after {
            left: 20px;
        }

        /* Reminder settings */
        .reminder-settings {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding-left: 48px;
        }

        .reminder-select {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            padding: 5px 10px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 2px;
            background: #fff;
            color: #333;
            cursor: pointer;
        }

        .reminder-label {
            font-size: 0.65rem;
            color: #888;
        }

        /* Tick style selector */
        .tick-style-selector {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            padding-left: 48px;
        }

        .tick-style-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            padding: 4px 10px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 2px;
            background: transparent;
            color: #666;
            cursor: pointer;
            text-transform: capitalize;
            transition: all 0.15s ease;
        }

        .tick-style-btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .tick-style-btn.active {
            background: #1a1a1a;
            color: #f5f5f0;
            border-color: #1a1a1a;
        }

        .tick-style-selector.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .tick-style-btn:disabled {
            cursor: default;
        }

        /* Activity Section - compact */
        .activity-section {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .activity-title {
            font-size: 0.55rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .activity-stats {
            font-size: 0.55rem;
            color: #888;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            gap: 2px;
            margin-bottom: 6px;
        }

        .activity-week {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .activity-day {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.05);
            border-radius: 0;
            cursor: pointer;
        }

        .activity-day:hover {
            opacity: 0.7;
        }

        /* Shaded levels - not solid */
        .activity-day.level-1 { background: rgba(0,0,0,0.12); }
        .activity-day.level-2 { background: rgba(0,0,0,0.22); }
        .activity-day.level-3 { background: rgba(0,0,0,0.35); }
        .activity-day.level-4 { background: rgba(0,0,0,0.55); }

        .activity-day.today {
            background: rgba(0,0,0,0.15);
        }
        .activity-day.today.level-1 { background: rgba(0,0,0,0.18); }
        .activity-day.today.level-2 { background: rgba(0,0,0,0.28); }
        .activity-day.today.level-3 { background: rgba(0,0,0,0.42); }
        .activity-day.today.level-4 { background: rgba(0,0,0,0.65); }

        .activity-legend {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 3px;
            font-size: 0.5rem;
            color: #999;
        }

        .legend-box {
            width: 8px;
            height: 8px;
            border-radius: 0;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #f5f5f0;
            padding: 15px 35px;
            border-radius: 3px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-15px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Today's log */
        .today-log {
            margin-top: 15px;
            padding: 12px 15px;
            background: rgba(0,0,0,0.02);
            border-radius: 3px;
            max-height: 100px;
            overflow-y: auto;
        }

        .today-log-title {
            font-size: 0.65rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .log-entry {
            font-size: 0.7rem;
            color: #555;
            padding: 3px 0;
        }

        .log-time { color: #999; }

        /* Auth UI */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 30px;
        }

        .auth-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 6px;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-top: -20px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .auth-input {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            padding: 14px 18px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 3px;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: #1a1a1a;
        }

        .auth-input::placeholder {
            color: #999;
        }

        .auth-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 14px 25px;
            border: 1px solid #1a1a1a;
            background: #1a1a1a;
            color: #f5f5f0;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.15s ease;
        }

        .auth-btn:hover {
            background: #2a2a2a;
        }

        .auth-btn.secondary {
            background: transparent;
            color: #1a1a1a;
        }

        .auth-btn.secondary:hover {
            background: rgba(0,0,0,0.05);
        }

        .auth-toggle {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
        }

        .auth-toggle a {
            color: #1a1a1a;
            cursor: pointer;
            text-decoration: underline;
        }

        .auth-error {
            font-size: 0.75rem;
            color: #c00;
            text-align: center;
            padding: 10px;
            background: rgba(200,0,0,0.05);
            border-radius: 3px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #999;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0,0,0,0.1);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            font-size: 0.7rem;
            color: #666;
        }

        .logout-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            padding: 6px 12px;
            border: 1px solid rgba(0,0,0,0.2);
            background: transparent;
            color: #666;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }

        .logout-btn:hover {
            background: rgba(0,0,0,0.05);
            color: #1a1a1a;
        }

        .sync-indicator {
            font-size: 0.6rem;
            color: #999;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
            padding: 3px 8px;
            background: rgba(0,0,0,0.04);
            border-radius: 3px;
        }

        .sync-indicator .sync-icon {
            font-size: 0.7rem;
        }

        .sync-indicator.connected {
            color: #4a4;
        }

        .sync-indicator.error {
            color: #a44;
            background: rgba(170,68,68,0.1);
        }

        .sync-indicator.connecting {
            color: #aa4;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a4;
        }

        .sync-dot.syncing {
            background: #888;
            animation: pulse 1s infinite;
        }

        /* Tooltips */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            background: #1a1a1a;
            color: #f5f5f0;
            font-size: 0.65rem;
            border-radius: 3px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 100;
            margin-bottom: 5px;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Compact mode for single screen */
        .eink-screen.compact {
            padding: 25px 40px;
        }

        .compact .header {
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .compact .main-content {
            padding: 10px 0;
        }

        .compact .series-selector {
            margin-bottom: 15px;
            padding: 8px 15px;
        }

        .compact .mode-tabs {
            margin-bottom: 15px;
        }

        .compact .timer-display {
            margin: 10px 0;

        const isWebGPUSupported = () => {

        // Native WebGPU Particle System
        const initWebGPUParticles = async (canvas) => {
            if (!navigator.gpu) return null;

            try {
                const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
                if (!adapter) return null;

                const device = await adapter.requestDevice();
                const context = canvas.getContext('webgpu');
                const format = navigator.gpu.getPreferredCanvasFormat();

                context.configure({
                    device,
                    format,
                    alphaMode: 'premultiplied',
                });

                const particleCount = 1000;
                const particleData = new Float32Array(particleCount * 4); // x, y, z, size
                const velocityData = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    particleData[i * 4] = (Math.random() - 0.5) * 2;
                    particleData[i * 4 + 1] = (Math.random() - 0.5) * 2;
                    particleData[i * 4 + 2] = Math.random() * 0.5;
                    particleData[i * 4 + 3] = Math.random() * 0.003 + 0.001;
                    velocityData[i * 3] = (Math.random() - 0.5) * 0.0005;
                    velocityData[i * 3 + 1] = (Math.random() - 0.5) * 0.0005;
                    velocityData[i * 3 + 2] = 0;
                }

                const particleBuffer = device.createBuffer({
                    size: particleData.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(particleBuffer, 0, particleData);

                const shaderCode = `
                    struct Uniforms {
                        time: f32,
                        running: f32,
                        aspect: f32,
                    }
                    @group(0) @binding(0) var<uniform> uniforms: Uniforms;

                    struct VertexOutput {
                        @builtin(position) position: vec4f,
                        @location(0) alpha: f32,
                    }

                    @vertex
                    fn vertexMain(@location(0) pos: vec4f) -> VertexOutput {
                        var output: VertexOutput;
                        let pulse = sin(uniforms.time * 0.5 + pos.x * 10.0) * 0.1 + 1.0;
                        let size = pos.w * pulse * (1.0 + uniforms.running * 0.5);

                        output.position = vec4f(
                            pos.x / uniforms.aspect + sin(uniforms.time * 0.2 + pos.y * 5.0) * 0.02,
                            pos.y + cos(uniforms.time * 0.15 + pos.x * 5.0) * 0.02,
                            pos.z,
                            1.0
                        );
                        output.alpha = 0.15 + uniforms.running * 0.15 + sin(uniforms.time + pos.x * 20.0) * 0.05;
                        return output;
                    }

                    @fragment
                    fn fragmentMain(@location(0) alpha: f32) -> @location(0) vec4f {
                        return vec4f(0.3, 0.3, 0.3, alpha);
                    }
                `;

                const shaderModule = device.createShaderModule({ code: shaderCode });

                const uniformBuffer = device.createBuffer({
                    size: 16,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });

                const bindGroupLayout = device.createBindGroupLayout({
                    entries: [{
                        binding: 0,
                        visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
                        buffer: { type: 'uniform' }
                    }]
                });

                const bindGroup = device.createBindGroup({
                    layout: bindGroupLayout,

                    layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vertexMain',
                        buffers: [{
                            arrayStride: 16,
                            attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }]

                        module: shaderModule,
                        entryPoint: 'fragmentMain',
                        targets: [{
                            format,
                            blend: {
                                color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                                alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
                            }
                        }]
                    },
                    primitive: { topology: 'point-list' }
                });

                let isRunning = false;
                let animationId;
                const startTime = performance.now();

                const render = () => {
                    const time = (performance.now() - startTime) / 1000;
                    const aspect = canvas.width / canvas.height;

                    device.queue.writeBuffer(uniformBuffer, 0, new Float32Array([time, isRunning ? 1 : 0, aspect, 0]));

                    const commandEncoder = device.createCommandEncoder();
                    const textureView = context.getCurrentTexture().createView();

                    const renderPass = commandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: textureView,
                            clearValue: { r: 0, g: 0, b: 0, a: 0 },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }]
                    });

                    renderPass.setPipeline(pipeline);
                    renderPass.setBindGroup(0, bindGroup);
                    renderPass.setVertexBuffer(0, particleBuffer);
                    renderPass.draw(particleCount);
                    renderPass.end();

                    device.queue.submit([commandEncoder.finish()]);
                    animationId = requestAnimationFrame(render);
                };

                const handleResize = () => {
                    canvas.width = window.innerWidth * Math.min(window.devicePixelRatio, 2);
                    canvas.height = window.innerHeight * Math.min(window.devicePixelRatio, 2);
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                render();

                console.log('WebGPU particles initialized');

                return {
                    setTimerState: (running) => { isRunning = running; },
                    destroy: () => {
                        cancelAnimationFrame(animationId);
                        window.removeEventListener('resize', handleResize);
                        device.destroy();
                    }
                };
            } catch (e) {
                console.log('WebGPU particle init failed:', e);
                return null;
            }

        // WebGL fallback using Three.js
        const initWebGLBackground = async () => {
            const canvas = document.getElementById('webgl-bg');
            if (!canvas) return null;

            // Try WebGPU first
            if (isWebGPUSupported()) {
                const webgpuSystem = await initWebGPUParticles(canvas);
                if (webgpuSystem) return webgpuSystem;
            }

            // Fallback to Three.js WebGL
            if (!window.THREE) return null;
            console.log('Using WebGL fallback');

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

                sizes[i] = Math.random() * 2 + 0.5;

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                particles.rotation.x += rotationSpeed * 0.3;

            const ringGeometry = new THREE.TorusGeometry(2.2, 0.03, 16, 100);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0x1a1a1a,
                transparent: true,
                opacity: 0.2

            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            scene.add(ring);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(2, 3, 5);
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xf0f0e8, 0.3);
            backLight.position.set(-2, -1, -3);

            camera.position.z = 5;

            let animationId;
            let progress = 0;
            let isRunning = false;
            let baseScale = 1;
            let targetScale = 1;

            const animate = () => {
                animationId = requestAnimationFrame(animate);

                const time = Date.now() * 0.001;

                // Smooth scale transition
                baseScale += (targetScale - baseScale) * 0.05;

                // Pulsation - slower when paused, faster when running
                const pulseSpeed = isRunning ? 1.5 : 0.5;
                const pulseAmount = isRunning ? 0.08 : 0.03;
                const pulse = Math.sin(time * pulseSpeed) * pulseAmount + 1;

                const scale = baseScale * pulse;
                mainSphere.scale.set(scale, scale, scale);
                innerSphere.scale.set(scale * 0.85, scale * 0.85, scale * 0.85);

                // Gentle rotation
                mainSphere.rotation.y = time * 0.1;
                mainSphere.rotation.x = Math.sin(time * 0.2) * 0.1;

        // ============================================
        // Ambient Sound System

        const ambientModes = {
            off: { name: 'Off', generate: null },
            focus: {
                name: 'Focus',
                generate: (ctx, gainNode) => {
                    // Deep focus drone - layered sine waves
                    const frequencies = [55, 110, 165, 82.5];
                    const oscillators = frequencies.map((freq, i) => {
                        const osc = ctx.createOscillator();
                        const oscGain = ctx.createGain();
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        oscGain.gain.value = 0.15 / (i + 1);
                        osc.connect(oscGain);
                        oscGain.connect(gainNode);
                        osc.start();
                        return { osc, gain: oscGain };
                    });

                    // Slow LFO for subtle movement
                    const lfo = ctx.createOscillator();
                    const lfoGain = ctx.createGain();
                    lfo.frequency.value = 0.1;
                    lfoGain.gain.value = 3;
                    lfo.connect(lfoGain);
                    lfoGain.connect(oscillators[0].osc.frequency);
                    lfo.start();

                    return () => {
                        oscillators.forEach(o => { o.osc.stop(); o.osc.disconnect(); });

                        lfo.disconnect();

            },
            rain: {
                name: 'Rain',
                generate: (ctx, gainNode) => {
                    // Brown noise for rain-like ambience
                    const bufferSize = 2 * ctx.sampleRate;
                    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);

                    let lastOut = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5; // Boost volume
                    }

                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    noise.loop = true;

                    // Filter for softer sound
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400;

                    noise.connect(filter);
                    filter.connect(gainNode);
                    noise.start();

                    return () => {
                        noise.stop();
                        noise.disconnect();
                        filter.disconnect();
                    };
                }
            },
            space: {
                name: 'Space',
                generate: (ctx, gainNode) => {
                    // Ethereal space ambience with slow sweeping tones
                    const oscillators = [];
                    const baseFreqs = [40, 60, 80];

                    baseFreqs.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const oscGain = ctx.createGain();
                        const filter = ctx.createBiquadFilter();

                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        filter.type = 'lowpass';
                        filter.frequency.value = 200;
                        filter.Q.value = 5;
                        oscGain.gain.value = 0.12;

                        osc.connect(filter);
                        filter.connect(oscGain);
                        oscGain.connect(gainNode);

                        lfo.frequency.value = 0.05 + i * 0.02;

                        lfo.connect(lfoGain);
                        lfoGain.connect(osc.frequency);
                        lfo.start();

                        oscillators.push({ osc, lfo, filter, gain: oscGain });

                    return () => {
                        oscillators.forEach(o => {
                            o.osc.stop();
                            o.lfo.stop();
                            o.osc.disconnect();
                            o.lfo.disconnect();
                        });

        const createAmbientSoundSystem = (audioCtx) => {
            if (!audioCtx) return null;

            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0;
            masterGain.connect(audioCtx.destination);

            let currentMode = 'off';
            let stopCurrentAmbient = null;
            let targetVolume = 0;

            const setMode = (mode) => {
                if (stopCurrentAmbient) {
                    stopCurrentAmbient();
                    stopCurrentAmbient = null;
                }

                currentMode = mode;
                if (mode !== 'off' && ambientModes[mode]?.generate) {
                    stopCurrentAmbient = ambientModes[mode].generate(audioCtx, masterGain);
                }
            };

            const setVolume = (vol) => {
                targetVolume = vol;
                masterGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1);
            };

            const getVolume = () => targetVolume;
            const getMode = () => currentMode;

            const destroy = () => {
                if (stopCurrentAmbient) {

                masterGain.disconnect();
            };

            return { setMode, setVolume, getVolume, getMode, destroy };

            for (let i = 0; i < count; i++) playOne(i * 0.25);

        const playWarningBeep = (audioCtx, masterGain) => {

        // ============================================
        // Voice Cue System - Pre-recorded Audio Files

        const voiceCueSystem = {
            enabled: true,
            audioCache: {},
            currentAudio: null,
            basePath: 'audio/voice/',

            init() {
                // Preload common audio files
                const preloadClips = ['start-focus', 'pause', 'resume', 'complete-focus',
                    'time-5min', 'time-1min', 'time-30sec', 'time-10sec'];
                preloadClips.forEach(id => this.preload(id));

                // Preload speech synthesis voices
                if ('speechSynthesis' in window) {

                    if (speechSynthesis.getVoices().length > 0) {
                        this.getPreferredVoice();

                    speechSynthesis.onvoiceschanged = () => {
                        this.preferredVoice = null; // Reset to reselect
                        this.getPreferredVoice();

                console.log('Voice cue system ready (pre-recorded audio + speech synthesis)');
            },

            preload(clipId) {
                if (!this.audioCache[clipId]) {
                    const audio = new Audio(this.basePath + clipId + '.mp3');
                    audio.preload = 'auto';
                    this.audioCache[clipId] = audio;
                }
            },

            play(clipId, priority = false) {
                if (!this.enabled) return;

                // Stop current audio if priority
                if (priority && this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                }

                // Get or create audio element
                if (!this.audioCache[clipId]) {
                    this.audioCache[clipId] = new Audio(this.basePath + clipId + '.mp3');
                }

                const audio = this.audioCache[clipId];
                audio.currentTime = 0;
                audio.volume = 0.8;
                this.currentAudio = audio;
                audio.play().catch(e => console.log('Voice play blocked:', e));
            },

            // Preferred female voice (cached after first lookup)
            preferredVoice: null,

            // Find a female voice - prefer natural/premium voices
            getPreferredVoice() {
                if (this.preferredVoice) return this.preferredVoice;

                const voices = speechSynthesis.getVoices();
                // Priority: Samantha, Zira, female Google voices, any female
                const femaleKeywords = ['samantha', 'zira', 'victoria', 'karen', 'moira', 'tessa', 'fiona', 'female', 'woman'];
                const premiumKeywords = ['natural', 'premium', 'enhanced', 'neural'];

                // First try premium female voices
                let voice = voices.find(v => {
                    const name = v.name.toLowerCase();
                    return femaleKeywords.some(k => name.includes(k)) && premiumKeywords.some(k => name.includes(k));
                });

                // Then try any female voice
                if (!voice) {
                    voice = voices.find(v => {
                        const name = v.name.toLowerCase();
                        return femaleKeywords.some(k => name.includes(k));
                    });
                }

                // Fallback: avoid obviously male voices
                if (!voice) {
                    const maleKeywords = ['david', 'james', 'mark', 'daniel', 'male', 'guy'];
                    voice = voices.find(v => !maleKeywords.some(k => v.name.toLowerCase().includes(k)));
                }

                this.preferredVoice = voice || voices[0];
                console.log('Selected voice:', this.preferredVoice?.name);
                return this.preferredVoice;
            },

            // Speak method with sultry female voice
            speak(text, priority = false) {
                if (!this.enabled) return;

                    utterance.voice = this.getPreferredVoice();
