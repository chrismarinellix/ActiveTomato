name: ActiveTomato
options:
  bundleIdPrefix: com.activetomato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Q7949R4ZJM
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1.0.0.4"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  ActiveTomato:
    build:
      targets:
        ActiveTomato: all
    run:
      config: Debug
      # Local/sandbox testing of the Pro IAP without App Store Connect.
      storeKitConfiguration: ActiveTomato.storekit
    archive:
      config: Release

targets:
  ActiveTomato:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        excludes:
          - "*.txt"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: ActiveTomato
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.activetomato.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Resources/ActiveTomato.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
